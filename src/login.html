<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Owner sign in | Baked By Zav</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Jost:wght@300;400;500&display=swap">
<style>
:root { color-scheme: dark; --bg: #0E1713; --surface: #13201A; --fg: #F1EBDD; --muted: #A7AE9F; --gold: #D4AF37; --bad: #E59A8C; --line: rgba(212, 175, 55, 0.34); }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 300 16px/1.6 "Jost", "Helvetica Neue", Arial, sans-serif; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
main { width: min(100%, 400px); border: 1px solid var(--line); background: var(--surface); padding: 28px; display: grid; gap: 18px; }
h1 { margin: 0; font: 400 32px/1.1 "Bodoni Moda", Georgia, serif; }
h1 em { color: var(--gold); }
p { margin: 0; color: var(--muted); }
label { font-size: 11.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
input { display: block; width: 100%; margin-top: 6px; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 0; padding: 11px 12px; }
button { font: 500 12.5px "Jost", sans-serif; letter-spacing: 0.18em; text-transform: uppercase; padding: 13px 22px; border: 1px solid var(--gold); background: var(--gold); color: var(--bg); cursor: pointer; }
button:disabled { opacity: 0.5; cursor: wait; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
#err { color: var(--bad); font-size: 15px; }
a { color: var(--gold); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Baked by Zav <em>owner</em></h1>
  <p>Sign in to edit the menu and see your orders.</p>
  <form id="f">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <p id="err" role="alert" hidden></p>
    <p style="margin-top:16px"><button id="go" type="submit">Sign in</button></p>
  </form>
  <p><a href="/">Back to the shop</a></p>
</main>
<script>
(function () {
  var next = new URLSearchParams(location.search).get("next") || "/#admin";
  if (next.charAt(0) !== "/" || next.charAt(1) === "/") next = "/#admin";
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var go = document.getElementById("go"), err = document.getElementById("err");
    go.disabled = true; err.hidden = true;
    fetch("/api/login", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json", "x-zav": "1" }, body: JSON.stringify({ password: document.getElementById("pw").value }) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (x.ok) { location.href = next; return; }
        err.textContent = (x.d.error && x.d.error.message) || "Could not sign in."; err.hidden = false; go.disabled = false;
      })
      .catch(function () { err.textContent = "Could not reach the server. Try again."; err.hidden = false; go.disabled = false; });
  });
})();
</script>
</body>
</html>
